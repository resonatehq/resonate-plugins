# The tests run against the one Rundeck the specification's §5 provisions:
# one container, one project, and the jobs the tests import into it. A test
# that watches an execution to its terminal state is measuring the provider,
# and the provider need not survive parallel load — its failure under it would
# look like a plugin bug. The provider is the shared fixture, so the tests are
# serial.
[env]
RUST_TEST_THREADS = "1"
