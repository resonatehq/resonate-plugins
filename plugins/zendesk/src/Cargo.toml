[package]
name = "resonate-plugin-zendesk"
version = "0.1.0"
edition = "2021"

[lib]

[dependencies]
resonate-core = { git = "https://github.com/resonatehq/resonate", branch = "core-crate" }
async-trait = "0.1"
base64 = "0.22"
fastrand = "2"
humantime-serde = "1"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }

[dev-dependencies]
# The in-process Resonate server the end-to-end test compiles the worker into.
resonate = { git = "https://github.com/resonatehq/resonate", branch = "core-crate" }
# The storage engine that server takes: the end-to-end test opens an
# in-memory SQLite one so nothing it writes outlives the test.
resonate-server-dbms = { git = "https://github.com/resonatehq/resonate", branch = "core-crate", default-features = false, features = ["sqlite"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync"] }
# Zendesk is SaaS only — the specification has no §5 — so the tests stand a
# local HTTP mock where the provider would be.
wiremock = "0.6"
